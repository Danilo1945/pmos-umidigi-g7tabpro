monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.disable-mmap = true
        audio.format = "S16LE"
        api.alsa.period-size = 2048
        api.alsa.headroom = 2048
        api.alsa.soft-mixer = true
      }
    }
  }
]

